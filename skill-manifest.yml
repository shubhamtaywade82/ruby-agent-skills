version: 2
name: ruby-agent-skills

defaults:
  always_consider:
    - ruby-clean-code
    - ruby-tdd-refactoring
  require_repository_inspection: true
  require_tests_for_behavior_changes: true
  prefer_existing_conventions: true
  require_version_awareness: true

skills:
  ruby-core:
    family: ruby
    path: skills/ruby-core/SKILL.md
    triggers: [Ruby syntax, Ruby semantics, object model, truthiness, method dispatch]
  ruby-data-types:
    family: ruby
    path: skills/ruby-data-types/SKILL.md
    triggers: [strings, symbols, numbers, nil, ranges, hashes, data representation]
  ruby-control-flow:
    family: ruby
    path: skills/ruby-control-flow/SKILL.md
    triggers: [if, unless, case, loops, boolean logic, branching]
  ruby-collections:
    family: ruby
    path: skills/ruby-collections/SKILL.md
    triggers: [arrays, hashes, Enumerable, map, select, grouping, deduplication, sorting]
  ruby-method-design:
    family: design
    path: skills/ruby-method-design/SKILL.md
    triggers: [new method, method refactor, parameters, return contract, guard clause]
  ruby-oop:
    family: design
    path: skills/ruby-oop/SKILL.md
    triggers: [class design, encapsulation, inheritance, polymorphism, composition]
  ruby-modules-mixins:
    family: design
    path: skills/ruby-modules-mixins/SKILL.md
    triggers: [module, mixin, include, extend, prepend, namespace]
  ruby-metaprogramming:
    family: ruby
    path: skills/ruby-metaprogramming/SKILL.md
    triggers: [reflection, define_method, method_missing, runtime method creation]
  ruby-gems-io-services:
    family: integration
    path: skills/ruby-gems-io-services/SKILL.md
    triggers: [gem, dependency, file I/O, CSV, HTTP client, service object]
  ruby-debugging:
    family: debugging
    path: skills/ruby-debugging/SKILL.md
    triggers: [bug, exception, stack trace, logging, debugging, production issue]
  ruby-clean-code:
    family: quality
    path: skills/ruby-clean-code/SKILL.md
    triggers: [code review, refactor, readability, naming, simplicity, maintainability]
  ruby-tdd-refactoring:
    family: quality
    path: skills/ruby-tdd-refactoring/SKILL.md
    triggers: [test, TDD, regression, refactor, behavior change]

  rails-architecture:
    family: rails
    path: skills/rails-architecture/SKILL.md
    triggers: [Rails feature, MVC, resource, REST, application structure]
  rails-routing:
    family: rails
    path: skills/rails-routing/SKILL.md
    triggers: [routes, route, resources, HTTP verb, URL helper, dispatch]
  rails-controllers:
    family: rails
    path: skills/rails-controllers/SKILL.md
    triggers: [controller action, params, render, redirect, response]
  rails-views:
    family: rails
    path: skills/rails-views/SKILL.md
    triggers: [ERB, view, partial, helper, form, presentation]
  rails-activerecord:
    family: rails
    path: skills/rails-activerecord/SKILL.md
    triggers: [model, migration, ActiveRecord, query, persistence]
  rails-associations:
    family: rails
    path: skills/rails-associations/SKILL.md
    triggers: [belongs_to, has_one, has_many, through, HABTM, relationship]
  rails-validations:
    family: rails
    path: skills/rails-validations/SKILL.md
    triggers: [validation, errors, validation context, invariant]
  rails-authentication:
    family: rails
    path: skills/rails-authentication/SKILL.md
    triggers: [authentication, session, sign in, sign out, protected route]
  rails-testing:
    family: rails-quality
    path: skills/rails-testing/SKILL.md
    triggers: [request test, model test, system test, integration test, Rails test]
  rails-generators:
    family: rails
    path: skills/rails-generators/SKILL.md
    triggers: [generator, scaffold, rails generate, CRUD scaffold]
  rails-deployment:
    family: operations
    path: skills/rails-deployment/SKILL.md
    triggers: [deployment, hosting, production, environment, release]

patterns:
  ruby-design:
    paths:
      - patterns/ruby-design/value-object.md
      - patterns/ruby-design/service-object.md
      - patterns/ruby-design/strategy-object.md
      - patterns/ruby-design/composition-over-inheritance.md
      - patterns/ruby-design/adapter.md
    triggers: [value object, service object, strategy, composition, inheritance, adapter, external interface]

  rails:
    paths:
      - patterns/rails/query-object.md
      - patterns/rails/form-object.md
      - patterns/rails/policy-boundary.md
      - patterns/rails/transaction-boundary.md
      - patterns/rails/request-flow.md
    triggers: [query object, form object, authorization policy, transaction boundary, request flow]

  testing:
    paths:
      - patterns/testing/regression-test.md
    triggers: [regression test, bug fix, regression coverage]

  algorithms:
    paths:
      - patterns/algorithms/two-pointers.md
      - patterns/algorithms/frequency-map.md
    triggers: [two pointers, pair sum, frequency map, counting, membership lookup]


runner:
  command: bin/eval
  result_schema: docs/EVAL_RESULT_SCHEMA.md
  documentation: docs/BENCHMARK_RUNNER.md

benchmarks:
  ruby-training:
    fixture_registry: benchmarks/ruby-training/fixtures.yml
    fixture_root: benchmarks/ruby-training/fixtures
    verifier: scripts/verify_training_eval.rb
    campaign_documentation: docs/BENCHMARK_CAMPAIGN.md
    comparison_schema: docs/BENCHMARK_COMPARISON_SCHEMA.md

evaluations:
  ruby-training:
    source: allerin-ruby-set-2
    schema: docs/EVAL_SCHEMA.md
    paths:
      - evals/ruby-training/selection-sort.yml
      - evals/ruby-training/recursive-selection-sort.yml
      - evals/ruby-training/smallest-missing.yml
      - evals/ruby-training/shopping-cart.yml
      - evals/ruby-training/triplet-sum.yml
      - evals/ruby-training/majority-element.yml
      - evals/ruby-training/distinct-elements.yml
      - evals/ruby-training/power-of-two.yml
      - evals/ruby-training/chocolate-feast.yml
    checks:
      - functional
      - oop
      - tests
