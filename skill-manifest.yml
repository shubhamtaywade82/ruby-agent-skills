version: 2
name: ruby-agent-skills

defaults:
  agent_workflow: agent-workflow
  always_consider:
    - ruby-clean-code
    - ruby-tdd-refactoring
  require_repository_inspection: true
  require_tests_for_behavior_changes: true
  prefer_existing_conventions: true
  require_version_awareness: true

skills:
  rails-zeitwerk:
    family: rails
    path: skills/rails-zeitwerk/SKILL.md
    triggers: [Zeitwerk, autoloading, eager loading, reloading, autoload paths, constant loading, Zeitwerk::NameError, zeitwerk:check, Rails autoloader, inflections, namespaces]
  ruby-performance:
    family: performance
    path: skills/ruby-performance/SKILL.md
    triggers: [performance, profiling, benchmark, benchmarking, latency, throughput, allocations, memory, GC, YJIT, slow query, N+1, caching, performance regression]
  rails-security:
    family: security
    path: skills/rails-security/SKILL.md
    triggers: [security, Rails security, Brakeman, bundler-audit, authentication security, authorization security, CSRF, XSS, SQL injection, SSRF, command injection, security review]
  ruby-concurrency:
    family: concurrency
    path: skills/ruby-concurrency/SKILL.md
    triggers: [concurrency, threads, Thread, Mutex, Monitor, Queue, thread pool, race condition, deadlock, thread safety, Fibers, scheduler, parallel I/O]
  ruby-runtime-compatibility:
    family: runtime
    path: skills/ruby-runtime-compatibility/SKILL.md
    triggers: [Ruby version, Rails version, Bundler version, runtime compatibility, version compatibility, Ruby upgrade, Rails upgrade, deprecation compatibility]
