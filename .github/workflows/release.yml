name: Release

on:
  push:
    tags: ["v*"]
  # Rebuild and attach assets for an existing tag, e.g. a release that was
  # first created in the GitHub UI and so never received its archive.
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag to build and publish (e.g. v1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}

    steps:
      - name: Check release tag format
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "release tag must look like vX.Y.Z: $VERSION" >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # Build exactly the tagged revision, also when dispatched from main.
          ref: refs/tags/${{ inputs.version || github.ref_name }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Validate skill library
        run: bash bin/validate

      - name: Smoke test evaluation runner
        run: ruby scripts/smoke_eval_runner.rb

      - name: Smoke test benchmark verifier
        run: ruby scripts/smoke_benchmark.rb

      - name: Smoke test agent adapter
        run: ruby scripts/smoke_agent_adapter.rb

      - name: Smoke test book integration campaign
        run: ruby scripts/smoke_workshop_benchmark.rb

      - name: Build release archive and verify offline install
        run: ruby scripts/build_release_archive.rb --version "$VERSION" --self-test

      - name: Independently verify release archive
        run: ruby scripts/verify_release_archive.rb "dist/ruby-agent-skills-$VERSION.tar.gz" --checksums dist/SHA256SUMS --check-files

      - name: Check archive reproducibility
        run: |
          first="$(sha256sum dist/ruby-agent-skills-"$VERSION".tar.gz | awk '{print $1}')"
          ruby scripts/build_release_archive.rb --version "$VERSION"
          second="$(sha256sum dist/ruby-agent-skills-"$VERSION".tar.gz | awk '{print $1}')"
          if [[ "$first" != "$second" ]]; then
            echo "release archive is not reproducible: $first != $second" >&2
            exit 1
          fi
          echo "release archive reproducible: $first"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_args=()
          if [[ "$VERSION" =~ -(rc|beta|alpha|test)\.?[0-9]*$ || "$VERSION" == *"-rc"* ]]; then
            prerelease_args+=(--prerelease)
          fi
          assets=("dist/ruby-agent-skills-$VERSION.tar.gz" dist/SHA256SUMS)
          if gh release view "$VERSION" >/dev/null 2>&1; then
            # A release created by hand (or by an earlier run) gets the verified
            # assets and the generated notes instead of failing the publish.
            gh release upload "$VERSION" "${assets[@]}" --clobber
            gh release edit "$VERSION" --notes-file dist/release-notes.md
          else
            gh release create "$VERSION" "${assets[@]}" \
              --title "Ruby Agent Skills $VERSION" \
              --notes-file dist/release-notes.md \
              "${prerelease_args[@]}"
          fi
