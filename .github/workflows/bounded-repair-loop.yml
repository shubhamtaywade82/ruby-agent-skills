# Autonomous Engineering Platform - bounded repair loop.
#
# When CI fails on a PR, up to MAX_ATTEMPTS repair attempts per PR are
# allowed (enforced by labels, not by AI judgement). Each attempt:
#   1. runs on a dedicated repair branch,
#   2. gets a bounded timeout and an explicit tool allowlist,
#   3. must pass a deterministic PATH GUARD proving it did not touch
#      platform security files,
#   4. pushes to the repair branch, which re-triggers ci.yml automatically.
# Attempt 4+ is refused with agent:escalate. No model key -> graceful no-op.
# See .github/AGENT_PLATFORM.md (bounded autonomy) and GOVERNANCE.md (section 6).

name: Agent - Bounded Repair Loop

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  pull-requests: write
  contents: write

concurrency:
  group: bounded-repair-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  repair:
    name: bounded-repair
    # pull_requests[0].number > 0 excludes fork PRs (GitHub reports an empty
    # array for forks): the job holds contents:write, so it must only ever
    # fire for same-repo branches. This is a deliberate security boundary.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.name == 'CI' &&
      github.event.workflow_run.pull_requests[0].number > 0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      pull-requests: write
      contents: write
    env:
      MAX_ATTEMPTS: "3"
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      FAILING_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Capability guard (engine selection)
        id: guard
        env:
          HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OPENAI: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          if [ "$HAS_ANTHROPIC" = "true" ]; then
            echo "engine=claude" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_OPENAI" = "true" ]; then
            echo "engine=codex" >> "$GITHUB_OUTPUT"
          else
            echo "engine=none" >> "$GITHUB_OUTPUT"
            echo "::notice::No model API key configured; bounded repair disabled. CI failure stands. See .github/AGENT_PLATFORM.md."
          fi

      - name: Enforce attempt budget (deterministic)
        id: budget
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          labels="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '[.labels[].name] | join(" ")')"
          attempt=$(( $(printf '%s' "$labels" | grep -oE 'repair-attempt-[0-9]+' | wc -l) + 1 ))
          if [ "$attempt" -gt "$MAX_ATTEMPTS" ]; then
            echo "::error::Repair budget exhausted (MAX_ATTEMPTS=$MAX_ATTEMPTS)."
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "agent:escalate" || true
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body \
              "Bounded repair gave up after $MAX_ATTEMPTS attempts (\`agent:escalate\`). Human intervention required." || true
            exit 1
          fi
          echo "attempt=$attempt" >> "$GITHUB_OUTPUT"
          echo "branch=agent/repair-pr-$PR_NUMBER-attempt-$attempt" >> "$GITHUB_OUTPUT"
          echo "Repair attempt $attempt of $MAX_ATTEMPTS for PR #$PR_NUMBER"

      - name: Check out failing SHA on repair branch
        if: steps.guard.outputs.engine != 'none'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Collect failure context
        if: steps.guard.outputs.engine != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          gh run view "$RUN_ID" --repo "$REPO" --log-failed > /tmp/failure.log 2>/dev/null \
            || echo "(log unavailable)" > /tmp/failure.log
          tail -c 20000 /tmp/failure.log > /tmp/failure-trimmed.log

      - name: AI repair (Claude engine)
        if: steps.guard.outputs.engine == 'claude'
        id: repair-claude
        uses: anthropics/claude-code-action@ea2298eeead3535f6cef2ded5fd8ccabeb6b50b4 # v1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          prompt: |
            You are the bounded repair agent for this repository. CI failed on
            PR #${{ env.PR_NUMBER }} at commit ${{ env.FAILING_SHA }} (attempt ${{ steps.budget.outputs.attempt }} of ${{ env.MAX_ATTEMPTS }}).

            Read .github/AGENT_PLATFORM.md section 4 first; its bounds are binding.

            The trimmed failure log is at /tmp/failure-trimmed.log. Diagnose and
            apply the MINIMAL fix on the current branch. Then run the local
            verification: bundle exec rubocop && bash bin/validate

            HARD RULES (violating any of these makes the repair invalid):
            - Never modify .github/workflows/**, .github/CODEOWNERS,
              .github/GOVERNANCE.md, .github/AGENT_PLATFORM.md.
            - Never edit tests or contracts SOLELY to make them pass; if the
              contract itself must change, explain why in the commit message.
            - Do not commit; leave changes in the working tree.
            - If the failure is environment-bound or you cannot fix it within
              this session, change nothing and exit non-zero.
          allowed_tools: "Read,Grep,Glob,Edit,Write,Bash(git diff:*),Bash(git status),Bash(bundle exec rubocop),Bash(bash bin/validate),Bash(ruby bin/cross-pack-verify:*)"
          timeout_minutes: "30"

      - name: AI repair (Codex engine fallback)
        if: steps.guard.outputs.engine == 'codex'
        id: repair-codex
        uses: openai/codex-action@1d82a3dba7c7988ec71ecae1ed5b8e8db96495c5 # v1
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          prompt: |
            You are the bounded repair agent for this repository. CI failed on
            PR #${{ env.PR_NUMBER }} at commit ${{ env.FAILING_SHA }} (attempt ${{ steps.budget.outputs.attempt }} of ${{ env.MAX_ATTEMPTS }}).

            The trimmed failure log is at /tmp/failure-trimmed.log. Diagnose and
            apply the MINIMAL fix on the current branch, then verify locally with:
            bundle exec rubocop && bash bin/validate

            HARD RULES: never modify .github/** files; never weaken tests solely
            to pass; do not commit (leave changes in the working tree); exit
            non-zero if you cannot fix it. The full failure log is available at
            /tmp/failure-trimmed.log - read it before proposing a fix.

      # ------------------------------------------------------------------
      # PATH GUARD - deterministic security control. The repair job fails
      # here if the agent touched any protected path, regardless of what
      # the agent believed it was allowed to do.
      # ------------------------------------------------------------------
      - name: Path guard (protected paths untouched)
        if: steps.guard.outputs.engine != 'none'
        run: |
          set -euo pipefail
          protected='^\.github/(workflows|CODEOWNERS|GOVERNANCE\.md|AGENT_PLATFORM\.md)'
          violations="$(git diff --name-only HEAD | grep -E "$protected" || true)"
          if [ -n "$violations" ]; then
            echo "::error::Repair violated protected paths:"
            echo "$violations"
            exit 1
          fi
          if [ -z "$(git diff --name-only HEAD)" ]; then
            echo "::notice::Repair made no changes; treating as a failed attempt."
            exit 1
          fi

      - name: Verify locally before push
        if: steps.guard.outputs.engine != 'none'
        run: |
          set -euo pipefail
          bundle exec rubocop && bash bin/validate

      - name: Push repair branch and label attempt
        if: steps.guard.outputs.engine != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.budget.outputs.branch }}
          ATTEMPT: ${{ steps.budget.outputs.attempt }}
        run: |
          set -euo pipefail
          git config user.name "autonomous-repair-agent"
          git config user.email "noreply@github.com"
          git checkout -b "$BRANCH"
          git commit -am "repair: CI failure on PR #$PR_NUMBER (attempt $ATTEMPT)

          Applied by the bounded repair loop. Failure context: run
          ${{ github.event.workflow_run.html_url }}.

          Bounds enforced: MAX_ATTEMPTS=$MAX_ATTEMPTS, path guard on
          .github/** security files, local verification required." \
            --author="autonomous-repair-agent <noreply@github.com>"
          git push origin "$BRANCH"
          gh label create "repair-attempt-$ATTEMPT" --repo "$REPO" --color fef2c0 >/dev/null 2>&1 || true
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "repair-attempt-$ATTEMPT" || true
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body \
            "Repair attempt $ATTEMPT/$MAX_ATTEMPTS pushed to \`$BRANCH\` (from $FAILING_SHA). CI will re-run on the branch push."

      - name: Escalate on repair-engine failure
        if: failure() && steps.guard.outputs.engine != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ATTEMPT: ${{ steps.budget.outputs.attempt }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body \
            "Repair attempt $ATTEMPT failed (agent error, path guard, or local verification). Budget remains $MAX_ATTEMPTS attempts total; the next CI failure triggers the next attempt." \
            || true
