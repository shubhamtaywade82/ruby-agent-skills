# Autonomous Engineering Platform - compiled agent workflow.
#
# Source of truth: agent-ci-investigator.md (Agentic Workflows format).
# This lock file is the hand-authored conventional implementation:
# ANTHROPIC_API_KEY drives the Claude engine; if absent but OPENAI_API_KEY
# exists, the Codex engine runs instead; if neither exists a deterministic
# failure digest is posted. Regenerate with `gh aw compile` when the
# preview is enabled. See .github/AGENT_PLATFORM.md.

name: Agent - CI Investigator

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  pull-requests: write
  contents: read

concurrency:
  group: agent-ci-investigator-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  investigate:
    name: investigate
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.name == 'CI'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      pull-requests: write
      contents: read
    steps:
      - name: Check out repository (default branch, read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect failed-job digest (deterministic)
        id: digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo "## Failed jobs (run $RUN_ID)"
            gh run view "$RUN_ID" --repo "$REPO" --json jobs \
              --jq '.jobs[] | select(.conclusion != "success" and .conclusion != "skipped") | "- **" + .name + "** (" + .conclusion + ")"'
            echo
            echo "## First failing log lines per failed job"
            gh run view "$RUN_ID" --repo "$REPO" --log-failed 2>/dev/null | head -60 || echo "(log unavailable)"
          } > ci-failure-digest.md
          {
            echo "digest<<DIGEST_EOF"
            cat ci-failure-digest.md
            echo "DIGEST_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Capability guard (engine selection)
        id: guard
        env:
          HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OPENAI: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          if [ "$HAS_ANTHROPIC" = "true" ]; then
            echo "engine=claude" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_OPENAI" = "true" ]; then
            echo "engine=codex" >> "$GITHUB_OUTPUT"
          else
            echo "engine=none" >> "$GITHUB_OUTPUT"
            echo "::notice::No model API key configured; posting deterministic digest only. See .github/AGENT_PLATFORM.md."
          fi

      - name: Post deterministic digest (no AI available)
        if: steps.guard.outputs.engine == 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          {
            echo "## CI Failure Investigation (deterministic digest)"
            echo
            echo "**Run:** $RUN_URL"
            echo
            cat ci-failure-digest.md
            echo
            echo "_Configure ANTHROPIC_API_KEY or OPENAI_API_KEY for AI root-cause analysis. See .github/AGENT_PLATFORM.md._"
          } > comment.md
          if [ -n "${{ github.event.workflow_run.pull_requests[0].number }}" ]; then
            gh pr comment "${{ github.event.workflow_run.pull_requests[0].number }}" \
              --repo "${{ github.repository }}" --body-file comment.md
          fi

      - name: AI investigation (Claude engine)
        if: steps.guard.outputs.engine == 'claude'
        uses: anthropics/claude-code-action@ea2298eeead3535f6cef2ded5fd8ccabeb6b50b4 # v1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          prompt: |
            You are the CI failure investigator defined in
            .github/workflows/agent-ci-investigator.md. Read that file and follow
            its Procedure and Constraints exactly for workflow run
            ${{ github.event.workflow_run.id }} (conclusion: failure).

            A deterministic digest of failed jobs and log heads is already
            prepared in ci-failure-digest.md in the working directory - start
            from it, then use `gh run view --log-failed` for detail. Post the
            structured investigation comment the source file specifies (exactly
            one), and apply the `ci-failure-investigated` label to the attached
            PR if one exists. Do NOT fix anything; do NOT push commits.

            <details><summary>Deterministic digest (pre-fetched)</summary>

            ${{ steps.digest.outputs.digest }}

            </details>
          allowed_tools: "Bash(gh run:*),Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh label:*),Read,Grep"
          timeout_minutes: "15"

      - name: AI investigation (Codex engine fallback)
        if: steps.guard.outputs.engine == 'codex'
        uses: openai/codex-action@1d82a3dba7c7988ec71ecae1ed5b8e8db96495c5 # v1
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          prompt: |
            You are the CI failure investigator defined in
            .github/workflows/agent-ci-investigator.md. Read that file and follow
            its Procedure and Constraints exactly for workflow run
            ${{ github.event.workflow_run.id }} (conclusion: failure).

            A deterministic digest is in ci-failure-digest.md - start from it,
            then use `gh run view --log-failed` for detail. Post the structured
            investigation comment the source file specifies (exactly one) with
            `gh pr comment`. Do NOT fix anything; do NOT push commits.

            Deterministic digest:

            ${{ steps.digest.outputs.digest }}
          sandbox: read-only
