name: Validate skills

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Lint Ruby (RuboCop)
        run: bundle exec rubocop

      - name: Audit validation gate integrity
        run: ruby -Itest test/validation_gate_integrity_system_test.rb

      - name: Validate skill library
        run: bash bin/validate

      - name: Smoke test evaluation runner
        run: ruby scripts/smoke_eval_runner.rb

      - name: Smoke test benchmark verifier
        run: ruby scripts/smoke_benchmark.rb

      - name: Smoke test agent adapter
        run: ruby scripts/smoke_agent_adapter.rb

      - name: Smoke test book integration campaign
        run: ruby scripts/smoke_workshop_benchmark.rb

      - name: Smoke test runtime profile
        run: ruby -Itest test/runtime_profile_test.rb