name: Validate skills

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only reads. The patterns/rails/autonomous-
# engineering-platform.md pattern documents the policy; audit_github_
# governance.rb enforces the permissions: block. The actual lint+validate+
# smoke-test steps live in the reusable workflow (.github/workflows/
# reusable-ruby-ci.yml) so downstream Rails repositories can adopt the
# same CI shape without duplicating the steps.
permissions:
  contents: read

jobs:
  validate:
    name: Validate via reusable Ruby CI
    uses: ./.github/workflows/reusable-ruby-ci.yml
    with:
      ruby-version: "3.3"
      run-smoke-tests: true
