id: performance-public-v1
version: 1
evaluation_set: performance
source: performance-v1
fixture_root: benchmarks/performance/fixtures
verifier: scripts/verify_performance_eval.rb
evaluations:
  - performance-allocation-boundary
  - cache-key-boundary
execution:
  repetitions: 3
  paired: true
  fresh_workspace_per_run: true
  same_fixture_for_pair: true
  require_same_agent_command_when_using_agent_command: true
controls:
  runtime:
    ruby: "3.3"
  hidden_cases: external-only
  require_complete_repetitions: true
