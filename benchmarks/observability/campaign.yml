id: rails-observability-public-v1
version: 1
evaluation_set: observability
source: rails-observability-v1
fixture_root: benchmarks/observability/fixtures
verifier: scripts/verify_observability_eval.rb
evaluations:
  - error-boundary
  - request-correlation
  - instrumentation-event
  - health-semantics
execution:
  repetitions: 3
  paired: true
  fresh_workspace_per_run: true
  same_fixture_for_pair: true
  require_same_agent_command_when_using_agent_command: true
controls:
  runtime:
    ruby: "3.3"
  hidden_cases: external-only
