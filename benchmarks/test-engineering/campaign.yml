id: rails-test-engineering-public-v1
version: 1
evaluation_set: test-engineering
source: rails-test-engineering-v1
fixture_root: benchmarks/test-engineering/fixtures
verifier: scripts/verify_test_engineering_eval.rb
evaluations:
  - boundary-selection
  - deterministic-job
  - parallel-safety
  - flaky-diagnosis
  - system-contract
  - test-performance
execution:
  repetitions: 3
  paired: true
  fresh_workspace_per_run: true
  same_fixture_for_pair: true
  require_same_agent_command_when_using_agent_command: true
controls:
  runtime:
    ruby: "3.3"
  hidden_cases: external-only
