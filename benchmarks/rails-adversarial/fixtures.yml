version: 1
source: rails-adversarial-v1
description: >
  Production-condition fixtures. Visible tests describe the requested feature;
  a withheld test per fixture (withheld/<id>/test_withheld.rb, never placed in
  the agent workspace) exercises the condition the visible tests leave out.
  Negative controls in controls/ must pass the visible tests and fail the
  withheld ones.
