id: reliability-public-v1
version: 1
evaluation_set: reliability
source: rails-reliability-engineering-v1
fixture_root: benchmarks/reliability/fixtures
verifier: scripts/verify_reliability_eval.rb
evaluations:
  - bulkhead-saturation
  - circuit-breaker-open
  - load-shed-threshold
  - slo-budget-exhaustion
execution:
  repetitions: 3
  paired: true
  fresh_workspace_per_run: true
  same_fixture_for_pair: true
  require_same_agent_command_when_using_agent_command: true
controls:
  runtime:
    ruby: "3.3"
  hidden_cases: external-only
  require_complete_repetitions: true
