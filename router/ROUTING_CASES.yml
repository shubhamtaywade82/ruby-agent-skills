version: 1
description: >
  Adversarial routing cases that document the intended primary and secondary
  skill ownership for overlapping Ruby/Rails engineering tasks. These cases
  are routing contracts, not a deterministic keyword classifier.

cases:
  - id: password-recovery-not-authorization
    prompt: >
      Add an expiring, single-use password reset flow with enumeration-safe
      responses and replay protection.
    primary_skills:
      - rails-authentication
    secondary_skills:
      - rails-security-engineering
      - rails-test-engineering
    boundary: authentication-vs-authorization

  - id: tenant-scoped-resource-access
    prompt: >
      Restrict invoice lookup to resources belonging to the authenticated
      user's tenant and prevent cross-tenant access.
    primary_skills:
      - rails-authorization
    secondary_skills:
      - rails-active-record
      - rails-security-engineering
      - rails-test-engineering
    boundary: authorization-vs-persistence

  - id: delayed-resource-authorization
    prompt: >
      A queued job deletes a resource after a delay; authorization must still
      be enforced when the job executes.
    primary_skills:
      - rails-cross-boundary-authorization-security
    secondary_skills:
      - rails-authorization
      - rails-active-job
      - rails-test-engineering
    boundary: authorization-vs-background-execution

  - id: realtime-subscription-authorization
    prompt: >
      Prevent an authenticated user from subscribing to another tenant's
      Action Cable stream and define reconnect behavior.
    primary_skills:
      - rails-action-cable
    secondary_skills:
      - rails-authorization
      - rails-cross-boundary-authorization-security
      - rails-test-engineering
    boundary: realtime-vs-authorization

  - id: signed-webhook-ingress
    prompt: >
      Receive a provider webhook, verify its signature, reject replayed or
      malformed requests, and only then process the event.
    primary_skills:
      - rails-api-integration
    secondary_skills:
      - rails-security-engineering
      - rails-observability
      - rails-test-engineering
    boundary: api-vs-security

  - id: api-version-compatibility
    prompt: >
      Add an API v2 response while keeping existing v1 clients compatible.
    primary_skills:
      - rails-api-integration
    secondary_skills:
      - rails-action-controller
      - rails-serialization-globalid-engineering
      - rails-test-engineering
    boundary: api-vs-controller

  - id: conditional-model-invariant
    prompt: >
      Add a validation that applies only in a named lifecycle context and
      remains consistent with the database invariant.
    primary_skills:
      - rails-validations
    secondary_skills:
      - rails-active-record
      - rails-database-engineering
      - rails-test-engineering
    boundary: validation-vs-database

  - id: n-plus-one-query-regression
    prompt: >
      Diagnose and fix a slow Rails endpoint caused by repeated association
      queries without changing the endpoint contract.
    primary_skills:
      - rails-performance
    secondary_skills:
      - rails-active-record
      - ruby-performance
      - rails-test-engineering
    boundary: performance-vs-persistence

  - id: autoloading-constant-mismatch
    prompt: >
      Fix a Zeitwerk::NameError caused by a file-to-constant mismatch while
      preserving reload and eager-load behavior.
    primary_skills:
      - rails-zeitwerk
    secondary_skills:
      - ruby-runtime-compatibility
      - rails-test-engineering
    boundary: loading-vs-runtime

  - id: route-shadowing-regression
    prompt: >
      Add a nested route without allowing an existing literal route to be
      shadowed by resourceful routing.
    primary_skills:
      - rails-routing
    secondary_skills:
      - rails-action-controller
      - rails-test-engineering
    boundary: routing-vs-controller

  - id: boot-time-provider-dependency
    prompt: >
      Add an initializer that depends on an external provider while preserving
      boot failure semantics, reload behavior, and readiness signaling.
    primary_skills:
      - rails-initialization-configuration-engineering
    secondary_skills:
      - rails-production-runtime
      - rails-reliability-engineering
      - rails-test-engineering
    boundary: initialization-vs-runtime

  - id: tenant-aware-authorization-cache
    prompt: >
      Cache an authorization decision without allowing one user's or tenant's
      decision to leak to another request.
    primary_skills:
      - rails-caching
    secondary_skills:
      - rails-authorization
      - rails-security-engineering
      - rails-test-engineering
    boundary: caching-vs-authorization

  - id: engine-namespace-boundary
    prompt: >
      Mount a Rails engine with isolated constants and routes without leaking
      host application authorization assumptions into the engine.
    primary_skills:
      - rails-engines-railties-engineering
    secondary_skills:
      - rails-routing
      - rails-zeitwerk
      - rails-authorization
      - rails-test-engineering
    boundary: engine-vs-host-routing

  - id: credential-key-rotation
    prompt: >
      Rotate Rails encryption keys while preserving deployment compatibility,
      secret handling, recovery, and verification of existing encrypted data.
    primary_skills:
      - rails-encryption-credentials-engineering
    secondary_skills:
      - rails-security-engineering
      - rails-reliability-engineering
      - rails-production-runtime
      - rails-test-engineering
    boundary: encryption-vs-operations

  - id: react-form-rails-validation-errors
    prompt: >
      The React order form posts to the Rails API; when Rails rejects the
      order, show each validation error next to the matching field and keep
      errors that belong to no field visible.
    primary_skills:
      - rails-react-integration
    secondary_skills:
      - rails-validations
    boundary: client-form-vs-server-validation

  - id: react-fetch-csrf-failure
    prompt: >
      Submitting a React form inside the Rails app fails with
      InvalidAuthenticityToken; fix it without weakening forgery protection.
    primary_skills:
      - rails-react-integration
    secondary_skills:
      - rails-security
      - rails-authentication
    boundary: csrf-vs-authentication

  - id: rails-json-contract-change-with-react-client
    prompt: >
      Rename total_cents to amount_cents in the orders JSON API that the
      React dashboard consumes, without breaking the dashboard.
    primary_skills:
      - rails-api-integration
    secondary_skills:
      - rails-react-integration
    boundary: server-contract-vs-client-consumer

  - id: branch-review-standards-and-spec
    prompt: >
      Review this branch against main: check it follows the repository's
      conventions and does everything issue 214 asked for, without scope
      creep. Do not change the code.
    primary_skills:
      - change-review
    secondary_skills:
      - ruby-clean-code
      - rubocop
    boundary: change-review-vs-minimality-review

  - id: diff-simplification-review
    prompt: >
      Review this diff only for what can be deleted or simplified: unused
      flexibility, one-use abstractions, and pass-through wrappers.
    primary_skills:
      - stack-minimality-review
    secondary_skills:
      - ruby-api-design
    boundary: minimality-review-vs-change-review

  - id: spec-then-tickets-not-wayfinder
    prompt: >
      We agreed partial refunds in this conversation; write it up as a spec
      with test seams and publish it to our local planning tracker.
    primary_skills:
      - planning-spec
    secondary_skills:
      - planning-tracker
    boundary: spec-vs-wayfinding

  - id: multi-session-effort-needs-a-map
    prompt: >
      Moving billing into its own Rails engine is too big for one session and
      we do not yet know the order of the decisions; plan it so several
      sessions can pick up the next decision.
    primary_skills:
      - planning-wayfinder
    secondary_skills:
      - planning-interview
      - planning-tracker
    boundary: wayfinding-vs-ticket-breakdown

  - id: schema-design-before-migration
    prompt: >
      Design the tables for subscriptions with plan changes over time, where
      invoices must keep the price that applied when they were issued and
      plan names must be unique per account.
    primary_skills:
      - rails-data-modeling
    secondary_skills:
      - rails-associations
      - rails-database-engineering
    boundary: data-modeling-vs-database-engineering

  - id: ruby-toolchain-vs-runtime-compatibility
    prompt: >
      Prepare a Ruby repository whose runtime declarations and local
      executables may disagree. Determine the actual Ruby, RubyGems, and
      Bundler provenance before changing dependencies or version constraints.
    primary_skills:
      - ruby-toolchain
    secondary_skills:
      - ruby-runtime-compatibility
      - ruby-debugging
    boundary: toolchain-vs-runtime-compatibility

  - id: rails-new-vs-generators
    prompt: >
      Create a new Rails application with an API-only shape and PostgreSQL,
      then add a resource to it using the appropriate Rails command.
      Distinguish application bootstrap from in-app generators.
    primary_skills:
      - rails-application-bootstrap
    secondary_skills:
      - rails-generators
      - ruby-toolchain
      - ruby-runtime-compatibility
    boundary: application-bootstrap-vs-generators

  - id: gem-authoring-vs-dependency-installation
    prompt: >
      Create a reusable Ruby gem, define its gemspec and public require path,
      then build and smoke-test the packaged artifact without publishing it.
      Keep this distinct from merely adding a gem dependency to an application.
    primary_skills:
      - ruby-gem-development
    secondary_skills:
      - ruby-toolchain
      - ruby-gems-io-services
      - ruby-tdd-refactoring
    boundary: gem-authoring-vs-dependency-installation

  - id: concurrent-uniqueness-race
    prompt: >
      Users are occasionally registered twice with the same email because the
      signup path checks existence then inserts. Fix it so a concurrent signup
      for the same address always results in exactly one user row.
    primary_skills:
      - rails-database-engineering
    secondary_skills:
      - rails-active-record
      - rails-test-engineering
    boundary: application-check-vs-database-constraint

  - id: webhook-idempotency-with-redelivery
    prompt: >
      A payment provider re-delivers webhooks on timeout. Implement the
      handler so the same event applied twice produces one payment record and
      one invoice state change, and a mid-write crash on first delivery is
      safe to retry.
    primary_skills:
      - rails-api-integration
    secondary_skills:
      - rails-reliability-engineering
      - rails-distributed-systems
      - rails-test-engineering
    boundary: api-ingress-vs-idempotency

  - id: transaction-retry-double-side-effect
    prompt: >
      A checkout flow charges a card, creates an order, and sends a
      confirmation email. Clients retry on timeout with the same request ID.
      Make the checkout idempotent so a retried call never charges twice and
      sends exactly one confirmation.
    primary_skills:
      - rails-distributed-systems
    secondary_skills:
      - rails-reliability-engineering
      - rails-active-record
      - rails-test-engineering
    boundary: distributed-idempotency-vs-active-record

  - id: authorization-alternate-access-path
    prompt: >
      An invoice is accessible through a show action protected by a policy.
      Add a CSV export endpoint and a background job that emails the CSV.
      Every new path must enforce the same authorization rule as show, and
      the job must re-authorize when it executes.
    primary_skills:
      - rails-cross-boundary-authorization-security
    secondary_skills:
      - rails-authorization
      - rails-active-job
      - rails-test-engineering
    boundary: controller-authorization-vs-background-job-re-authorization

  - id: zeitwerk-nested-constant-drift
    prompt: >
      A module constant resolves in development but raises NameError in
      production eager loading. Diagnose the file/path/namespace mismatch
      without adding require_dependency calls.
    primary_skills:
      - rails-zeitwerk
    secondary_skills:
      - rails-test-engineering
      - ruby-runtime-compatibility
    boundary: autoloading-vs-eager-loading

  - id: sti-polymorphic-boundary
    prompt: >
      A table has a type column used for STI and a separate polymorphic
      association. Add a query scope and explain what indexes, query shapes,
      and authorization implications change.
    primary_skills:
      - rails-active-record
    secondary_skills:
      - rails-data-modeling
      - rails-associations
      - rails-database-engineering
      - rails-test-engineering
    boundary: sti-vs-polymorphism-query-contract
