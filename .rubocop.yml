# frozen_string_literal: true

# Ruby baseline:
#   https://rubystyle.guide/
# Rails extension/style guidance:
#   https://rails.rubystyle.guide/
#
# RuboCop is the executable enforcement layer for the Ruby style guide. This
# file lints *this repository* and runs in CI (`bundle exec rubocop`).
#
# Plugin selection follows applicability, not the full catalog. The complete
# plugin catalog for target applications is documented in
# data/rubocop/plugins.yml and docs/RUBOCOP_PLUGINS.md. Loading all of it here
# did not work: three extensions are not lint_roller plugins and failed to
# load, cookstyle replaces RuboCop's default configuration with Chef's, and
# rubocop-changed narrows linting to changed files. Plugins for frameworks
# this repository does not use (Rails, Sequel, Capybara, FactoryBot, I18n,
# Sorbet, GraphQL, SketchUp) only produced false positives. rubocop-rspec
# stays loaded so the RSpec style policy below is validated as a reference
# policy; this repository has no lintable specs (benchmark fixtures are
# excluded), and consuming projects enforce it from their own config.
#
# For a target application, select plugins from the catalog by the
# frameworks it actually uses, confirm each installed extension supports the
# plugin API (gem metadata `default_lint_roller_plugin`) before listing it
# under `plugins:` rather than `require:`, and let rubocop-rails resolve
# TargetRailsVersion from Gemfile.lock.
#
# Existing offenses are recorded in .rubocop_todo.yml; CI fails on new ones.
# Remove entries from the todo as the corresponding code is cleaned up.

inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-performance
  - rubocop-minitest
  - rubocop-rspec
  - rubocop-thread_safety

# The Ruby Style Guide recommends 80 columns and explicitly allows teams to
# increase this to 100 or 120. This repository standardizes on 100.
Layout/LineLength:
  Max: 100

Layout/IndentationWidth:
  Width: 2

# The Ruby Style Guide requires a consistent quoting style and allows either.
# Every Ruby file in this repository uses double quotes.
Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

# Generated/fixture artifacts are validated by their own benchmark tooling and
# should not be rewritten by broad style corrections.
AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  DisplayCopNames: true
  ExtraDetails: true
  Exclude:
    - 'tmp/**/*'
    - 'vendor/**/*'
    - '.ruby-agent-eval/**/*'
    - 'benchmarks/**/*'

# RSpec style guide policy. These cops are linked to
# https://rspec.rubystyle.guide/ by rubocop-rspec.
RSpec/AnyInstance:
  Enabled: true
RSpec/BeforeAfterAll:
  Enabled: true
RSpec/ContextWording:
  Prefixes:
    - when
    - with
    - without
RSpec/ExampleWording:
  Enabled: true
RSpec/HookArgument:
  EnforcedStyle: implicit
RSpec/ImplicitBlockExpectation:
  Enabled: true
RSpec/InstanceVariable:
  Enabled: true
RSpec/LeadingSubject:
  Enabled: true
RSpec/MultipleExpectations:
  Max: 1
RSpec/NamedSubject:
  EnforcedStyle: always
RSpec/PredicateMatcher:
  EnforcedStyle: inflected
