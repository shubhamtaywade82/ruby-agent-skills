id: selection-sort
version: 1
title: Selection sort and recursive selection sort
category: ruby-training
source: allerin-ruby-set-2
skills:
  - ruby-collections
  - ruby-method-design
  - ruby-oop
  - ruby-tdd-refactoring
patterns: []
prompt: |
  Implement selection sort and recursive selection sort in Ruby.
  Both implementations must sort the supplied array correctly.
  Keep the two algorithms distinguishable so the recursive implementation
  actually expresses the recursive selection-sort approach.
constraints:
  time_complexity: O(n^2)
  required_design:
    - object-oriented design
  mutation:
    unspecified: true
checks:
  - functional
  - complexity
  - oop
  - tests
  - edge_cases
cases:
  - name: unsorted
    input: [64, 25, 12, 22, 11]
    expected: [11, 12, 22, 25, 64]
  - name: already-sorted
    input: [1, 2, 3, 4]
    expected: [1, 2, 3, 4]
  - name: duplicates
    input: [3, 1, 3, 2, 1]
    expected: [1, 1, 2, 3, 3]
  - name: empty
    input: []
    expected: []
grading:
  functional: both implementations produce the expected ordering.
  complexity: neither implementation uses a comparison-sort strategy with a stronger hidden complexity claim.
  oop: domain/algorithm behavior is encapsulated in a cohesive object or equivalent OOP design.
  tests: tests cover normal, already-sorted, duplicate and empty inputs.
  scope: no unrelated framework or repository changes.
