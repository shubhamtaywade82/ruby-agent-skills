id: equilibrium-index
version: 1
title: Equilibrium index
category: ruby-training
source: allerin-ruby-set-3
skills:
  - ruby-collections
  - ruby-method-design
  - ruby-oop
patterns: []
prompt: |
  Implement a method that finds the leftmost equilibrium index of an array
  of integers: an index where the sum of the elements to its left equals
  the sum of the elements to its right. Return nil when no such index
  exists.
constraints:
  time_complexity: O(n)
  required_design:
    - object-oriented design
checks:
  - functional
  - oop
  - tests
cases:
  - name: interior-equilibrium
    input: [-7, 1, 5, 2, -4, 3, 0]
    expected: 3
  - name: first-of-several
    input: [1, 3, 5, 2, 2]
    expected: 2
  - name: single-element
    input: [5]
    expected: 0
  - name: none-exists
    input: [1, 2, 3, 4, 5]
    expected: null
  - name: empty
    input: []
    expected: null
grading:
  functional: the implementation returns the leftmost equilibrium index, or nil, for every case.
  oop: the search is encapsulated in a cohesive object.
  tests: tests cover an interior equilibrium, several candidates, a single element, no equilibrium, and empty input.
  scope: no unrelated framework or repository changes.
