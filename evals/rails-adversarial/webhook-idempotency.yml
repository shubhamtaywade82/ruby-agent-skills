id: webhook-idempotency
version: 1
title: Payment webhook survives redelivery and retries
category: rails
source: rails-adversarial-v1
skills:
  - rails-api-integration
  - rails-reliability-engineering
  - agent-workflow
patterns:
  - webhook-ingestion
  - inbox-deduplication
prompt: |
  Implement PaymentWebhook#call(body:, signature:) in lib/solution.rb for the
  payment provider's webhook. The signature is the hex HMAC-SHA256 of the raw
  body with the shared secret; return :rejected when it does not match. On
  payment.succeeded mark the invoice paid and record a payment with the event's
  amount_cents, returning :processed. Return :ignored for other event types.
  Schema.migrate defines the storage schema. lib/store.rb is the database
  adapter; do not change it. Extend test/test_solution.rb.
constraints:
  required_design:
    - each provider event is applied at most once
    - an event's effects commit together with its deduplication record
  forbidden:
    - accepting unsigned or mis-signed payloads
    - changing lib/store.rb
checks:
  - functional
  - tests
  - adversarial
  - scope_control
cases:
  - name: redelivery
    input: the same event delivered twice
    expected: one payment recorded
  - name: retry-after-failure
    input: the first attempt fails mid-write and the provider retries
    expected: invoice paid with exactly one payment
grading:
  functional: visible feature tests pass
  tests: workspace tests exist and pass
  adversarial: withheld redelivery and retry tests pass
  scope_control: only lib/solution.rb and tests change
