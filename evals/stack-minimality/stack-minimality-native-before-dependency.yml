id: stack-minimality-native-before-dependency
version: 1
title: Prefer platform capability before a new dependency
category: stack-minimality
source: ponytail-stack-adaptation-v1
skills:
  - stack-minimality
  - react-accessibility-performance
  - ruby-gems-io-services
patterns:
  - pattern:react-native-before-dependency
  - pattern:existing-dependency-before-new-gem-package
prompt: |
  Implement a narrow browser or Ruby utility requirement in a repository that already has dependencies. Evaluate native, standard-library, framework, and installed dependency capability before adding another package.
constraints:
  required_design:
    - native, standard-library, or existing dependency considered first
    - new dependency requires concrete justification
checks:
  - functional
  - tests
  - contract
  - scope_control
cases:
  - name: primary-path
    input: Choose the smallest design that preserves the stated contract.
    expected:
      stack-minimality: avoid speculative complexity
  - name: boundary-exception
    input: A real ownership, variation, or integration boundary exists.
    expected:
      stack-minimality: add only the boundary the contract actually requires
grading:
  functional: The requested behavior works.
  tests: Focused verification covers changed behavior.
  contract: The implementation preserves the owning boundary and its guarantees.
  scope_control: No unrelated architecture or dependency migration is introduced.
