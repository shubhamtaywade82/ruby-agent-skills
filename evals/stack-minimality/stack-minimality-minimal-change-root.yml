id: stack-minimality-minimal-change-root
version: 1
title: Fix the shared root cause once
category: stack-minimality
source: ponytail-stack-adaptation-v1
skills:
  - stack-minimality
  - ruby-debugging
  - ruby-tdd-refactoring
patterns:
  - pattern:minimal-change-at-shared-root
prompt: |
  A shared transformation or validation bug affects several callers, but the ticket names only one path. Reproduce the defect and fix it at the common owner rather than patching each caller independently.
constraints:
  required_design:
    - regression test first
    - fix at shared root when caller contracts are shared
checks:
  - functional
  - tests
  - contract
  - scope_control
cases:
  - name: primary-path
    input: Choose the smallest design that preserves the stated contract.
    expected:
      stack-minimality: avoid speculative complexity
  - name: boundary-exception
    input: A real ownership, variation, or integration boundary exists.
    expected:
      stack-minimality: add only the boundary the contract actually requires
grading:
  functional: The requested behavior works.
  tests: Focused verification covers changed behavior.
  contract: The implementation preserves the owning boundary and its guarantees.
  scope_control: No unrelated architecture or dependency migration is introduced.
