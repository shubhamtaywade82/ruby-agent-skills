id: stack-minimality-react-state-boundary
version: 1
title: Keep React state at the smallest owner
category: stack-minimality
source: ponytail-stack-adaptation-v1
skills:
  - stack-minimality
  - react-state-effects
  - react-architecture
patterns:
  - pattern:react-local-state-before-context
  - pattern:react-derived-state-in-render
prompt: |
  Refactor a React feature where one component owns state used only by its subtree. Remove unnecessary context or duplicated derived state without changing user-visible behavior.
constraints:
  required_design:
    - smallest valid state owner
    - derived values are not stored as duplicate state
checks:
  - functional
  - tests
  - contract
  - scope_control
cases:
  - name: primary-path
    input: Choose the smallest design that preserves the stated contract.
    expected:
      stack-minimality: avoid speculative complexity
  - name: boundary-exception
    input: A real ownership, variation, or integration boundary exists.
    expected:
      stack-minimality: add only the boundary the contract actually requires
grading:
  functional: The requested behavior works.
  tests: Focused verification covers changed behavior.
  contract: The implementation preserves the owning boundary and its guarantees.
  scope_control: No unrelated architecture or dependency migration is introduced.
