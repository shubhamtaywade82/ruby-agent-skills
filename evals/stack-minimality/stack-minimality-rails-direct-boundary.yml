id: stack-minimality-rails-direct-boundary
version: 1
title: Prefer the smallest existing Rails boundary
category: stack-minimality
source: ponytail-stack-adaptation-v1
skills:
  - stack-minimality
  - rails-architecture
  - ruby-service-objects
patterns:
  - pattern:rails-convention-before-abstraction
  - pattern:active-record-before-repository
prompt: |
  Add a Rails feature whose behavior is a direct read/write through one existing model and controller boundary. Choose the smallest design that preserves the endpoint contract.
constraints:
  required_design:
    - reuse the existing Rails boundary when it owns the behavior
    - no speculative service or repository layer
checks:
  - functional
  - tests
  - contract
  - scope_control
cases:
  - name: primary-path
    input: Choose the smallest design that preserves the stated contract.
    expected:
      stack-minimality: avoid speculative complexity
  - name: boundary-exception
    input: A real ownership, variation, or integration boundary exists.
    expected:
      stack-minimality: add only the boundary the contract actually requires
grading:
  functional: The requested behavior works.
  tests: Focused verification covers changed behavior.
  contract: The implementation preserves the owning boundary and its guarantees.
  scope_control: No unrelated architecture or dependency migration is introduced.
