id: rails-cross-boundary-authorization-security-contract
version: 1
title: Compose authorization consistently across Rails controllers, services, jobs, APIs, realtime, engines, operations, events, capabilities, caches, and audit
category: security
source: rails-cross-boundary-authorization-security-v1
skills:
  - rails-cross-boundary-authorization-security
  - rails-authorization
  - rails-authentication
  - rails-security-engineering
  - rails-active-record
  - rails-active-job
  - rails-action-cable
  - rails-engines-railties-engineering
  - rails-operational-tasks-maintenance
  - rails-event-driven-messaging
  - rails-caching
  - rails-observability
  - rails-test-engineering
patterns:
  - authorization-context-contract
  - authorization-decision-boundary
  - authorized-resource-resolution
  - controller-service-authorization-composition
  - background-reauthorization-composition
  - api-authorization-composition
  - realtime-authorization-composition
  - engine-authorization-composition
  - operational-authorization-composition
  - event-consumer-authorization-contract
  - capability-propagation-contract
  - authorization-denial-contract
  - authorization-cache-composition
  - authorization-audit-composition
prompt: |
  Implement or review a Rails authorization change that crosses more than one execution boundary. Identify the authoritative authorization mechanism, map every entry point, define actor/action/resource/context, secure resource lookup and tenant scope, re-authorize delayed execution, compose API/realtime/engine/task/event boundaries, make denial/cache/audit semantics explicit, and test stale/revoked/cross-tenant scenarios.
constraints:
  required_design:
    - one authoritative authorization decision boundary
    - explicit actor/action/resource/context
    - security-aware resource lookup
    - current authorization for delayed execution
    - explicit boundary-specific denial semantics
    - complete cache identity and invalidation when authorization is cached
    - audit evidence at the authoritative decision boundary when required
checks:
  - functional
  - tests
  - contract
  - scope_control
cases:
  - name: context
    input: policy requires tenant and resource state
    expected: security context is explicit and complete
  - name: decision-boundary
    input: same operation has controller and job callers
    expected: one authoritative authorization boundary exists
  - name: resource-resolution
    input: cross-tenant object id
    expected: lookup cannot bypass tenant/resource scope
  - name: service-parity
    input: direct service invocation
    expected: controller authorization cannot be the only security layer
  - name: background
    input: membership revoked after enqueue
    expected: job re-authorizes current state
  - name: api
    input: authenticated cross-tenant API request
    expected: auth context, scope, action authorization, and denial semantics are explicit
  - name: realtime
    input: membership revoked after subscription
    expected: stream/action access is rejected or terminated appropriately
  - name: engine
    input: protected mounted engine route
    expected: engine authorization does not rely accidentally on host-only checks
  - name: operational
    input: privileged Rake maintenance command
    expected: operator/environment/capability boundary is explicit
  - name: event
    input: replayed event after ownership change
    expected: current authorization prevents stale sensitive side effects
  - name: capability
    input: downstream operation receives an authorization capability
    expected: scope, audience, and lifetime are explicit
  - name: denial
    input: unauthorized request through multiple surfaces
    expected: denial mapping avoids unnecessary existence disclosure
  - name: cache
    input: cached authorization after role revocation
    expected: cache identity/invalidation prevents stale permission
  - name: audit
    input: sensitive allow/deny decision
    expected: authoritative audit evidence is generated without secrets
grading:
  functional: protected operations remain correctly authorized from every supported boundary
  tests: cross-boundary stale/revoked/tenant/security scenarios are executable
  contract: identity, context, lookup, decision, denial, cache, and audit boundaries remain explicit
  scope_control: no unrelated authorization framework or application migration is introduced
