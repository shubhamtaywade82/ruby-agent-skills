id: rails-encryption-credentials-contract
version: 1
title: Preserve Rails credential, secret, key-management, and Active Record encryption boundaries
category: rails
source: rails-encryption-credentials-v1
skills:
  - rails-encryption-credentials-engineering
  - rails-security-engineering
  - rails-production-runtime
  - rails-initialization-configuration-engineering
  - rails-observability
  - rails-active-record
  - rails-database-engineering
  - rails-reliability-engineering
  - rails-test-engineering
  - ruby-runtime-compatibility
patterns:
  - credentials-store-contract
  - credentials-environment-selection
  - master-key-boundary
  - credentials-editing-workflow
  - secret-key-base-contract
  - credentials-redaction-contract
  - active-record-encryption-contract
  - deterministic-encryption-query-contract
  - encrypted-storage-capacity-contract
  - encrypted-data-migration-contract
  - encryption-key-rotation-contract
  - credentials-testing-contract
prompt: |
  Implement or review a Rails credentials, secret, key-management, or Active Record encryption change using the repository's real Rails/Ruby versions and deployment conventions. Keep secret storage, runtime delivery, persisted-data encryption, redaction, rotation, migration, and recovery boundaries explicit.
constraints:
  required_design:
    - secret store and key delivery are explicit
    - environment-specific credential selection is explicit
    - production-required keys fail closed
    - encrypted attributes have explicit query/storage semantics
    - key rotation and migration have recovery evidence
    - no real secrets enter tests or logs
checks:
  - functional
  - tests
  - contract
  - scope_control
cases:
  - name: credential-store
    input: new sensitive API credential
    expected: approved encrypted/runtime secret store and key boundary are explicit
  - name: environment-selection
    input: environment-specific credential change
    expected: correct credential/key paths are selected and tested
  - name: master-key
    input: production credential boot
    expected: master-key delivery is external and missing-key behavior is explicit
  - name: editing
    input: credential modification
    expected: credentials tooling and environment conventions are used
  - name: secret-key-base
    input: secret_key_base change
    expected: ownership and session/protected-state impact are understood
  - name: redaction
    input: sensitive credential or encrypted attribute
    expected: parameters, logs, traces, jobs, and inspection paths are protected
  - name: active-record-encryption
    input: new encrypted model attribute
    expected: keys, declaration, column, filtering, and round-trip behavior are explicit
  - name: deterministic
    input: searchable encrypted identifier
    expected: deterministic encryption is justified by query semantics and its tradeoff documented
  - name: storage
    input: encrypted string migration
    expected: ciphertext/storage overhead and indexing constraints are tested
  - name: migration
    input: existing plaintext field migration
    expected: resumable migration, verification, and recovery path exist
  - name: rotation
    input: encryption key rotation
    expected: old/new compatibility and retirement sequence are tested
  - name: testing
    input: credential/encryption behavior
    expected: synthetic secrets and failure-path tests are used
grading:
  functional: credential/encryption behavior matches the intended boundary
  tests: security behavior and failure paths are executable
  contract: storage, delivery, query, migration, rotation, and redaction contracts are explicit
  scope_control: no unrelated security or framework migration is introduced
