id: react-testing-contract
version: 1
title: React Testing Contract
category: react-typescript
source: react-typescript-engineering-v1
skills:
  - react-testing-engineering
patterns:
  - react-user-interaction-test
  - react-network-mock-boundary
prompt: |
  Test an async form using user interaction and a controlled network boundary without private-state assertions.
  Inspect the repository before choosing the implementation shape. Preserve existing conventions, keep runtime validation separate from compile-time types, and add focused verification.
constraints:
  required_boundary: react-testing-engineering
checks:
  - functional
  - tests
  - contract
  - scope_control
cases:
  - name: design
    input: Test an async form using user interaction and a controlled network boundary without private-state assertions.
    expected:
      react-user-interaction-test: explicit and justified
  - name: failure-path
    input: Test an async form using user interaction and a controlled network boundary without private-state assertions. with an invalid, asynchronous, or boundary-heavy variant
    expected:
      verification: focused tests cover the failure or recovery path
grading:
  functional: The resulting behavior satisfies the task contract.
  tests: Verification covers the intended behavior and failure paths.
  contract: The TypeScript or React boundary remains explicit and version-aware.
  scope_control: No unrelated framework or build migration is introduced.
