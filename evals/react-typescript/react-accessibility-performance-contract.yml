id: react-accessibility-performance-contract
version: 1
title: React Accessibility and Performance Contract
category: react-typescript
source: react-typescript-engineering-v1
skills:
  - react-accessibility-performance
patterns:
  - react-accessible-interaction
  - react-focus-management
  - react-render-performance-budget
prompt: |
  Build an interactive dialog with keyboard focus recovery and justify any render optimization with workload evidence.
  Inspect the repository before choosing the implementation shape. Preserve existing conventions, keep runtime validation separate from compile-time types, and add focused verification.
constraints:
  required_boundary: react-accessibility-performance
checks:
  - functional
  - tests
  - contract
  - scope_control
cases:
  - name: design
    input: Build an interactive dialog with keyboard focus recovery and justify any render optimization with workload evidence.
    expected:
      react-focus-management: explicit and justified
  - name: failure-path
    input: Build an interactive dialog with keyboard focus recovery and justify any render optimization with workload evidence. with an invalid, asynchronous, or boundary-heavy variant
    expected:
      verification: focused tests cover the failure or recovery path
grading:
  functional: The resulting behavior satisfies the task contract.
  tests: Verification covers the intended behavior and failure paths.
  contract: The TypeScript or React boundary remains explicit and version-aware.
  scope_control: No unrelated framework or build migration is introduced.
