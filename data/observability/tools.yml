version: 1
owner: rails-observability
source:
  error_reporting: https://guides.rubyonrails.org/error_reporting.html
  instrumentation: https://guides.rubyonrails.org/active_support_instrumentation.html
  controller: https://guides.rubyonrails.org/action_controller_overview.html
  configuring: https://guides.rubyonrails.org/configuring.html
tools:
  rails-test:
    category: request_testing
    command: bin/rails test
    application_only: true
  rails-routes:
    category: request_inspection
    command: bin/rails routes
    application_only: true
  rails-runner:
    category: runtime_inspection
    command: bundle exec rails runner
    application_only: true
  lograge:
    category: structured_request_logging
    gem: lograge
    optional: true
    notes:
      - collapses multi-line Rails request logs into single-line structured events
      - pair with config.filter_parameters so secrets never reach a log aggregator
  sentry-ruby:
    category: error_reporting
    gem: sentry-ruby
    optional: true
  sentry-rails:
    category: error_reporting
    gem: sentry-rails
    optional: true
  appsignal:
    category: application_performance_monitoring
    gem: appsignal
    optional: true
    notes:
      - hosted error and performance reporting; a third-party service
      - confirm data residency and payload contents before enabling in production
  newrelic_rpm:
    category: application_performance_monitoring
    gem: newrelic_rpm
    optional: true
    notes:
      - transaction and slow-SQL tracing for production
      - agent defaults are broad; scope what is reported before enabling
  scout_apm:
    category: application_performance_monitoring
    gem: scout_apm
    optional: true
    notes:
      - hosted APM with per-endpoint allocation and response-time reporting
  rollbar:
    category: error_reporting
    gem: rollbar
    optional: true
    notes:
      - error aggregation and alerting; this catalog already carries sentry-ruby for the same job
      - pick one error backend rather than running both, they split ownership without adding coverage
  rails_semantic_logger:
    category: structured_logging
    gem: rails_semantic_logger
    optional: true
    notes:
      - replaces the default logger with levelled, structured events
      - changes log shape, so downstream log consumers must be checked before enabling
  health_check:
    category: health_endpoint
    gem: health_check
    optional: true
    notes:
      - exposes database, cache, and queue checks for load balancers
      - a health endpoint that touches dependencies must stay cheap enough to poll
  prometheus-client:
    category: metrics
    gem: prometheus-client
    optional: true
    notes:
      - low-level metric registry and exposition format; dashboards are a separate system
      - pick metric names and labels deliberately, they are expensive to change
selection:
  rules:
    - "Use repository request/test conventions."
    - "Resolve Rails version before relying on version-specific controller or health behavior."
    - "Do not treat logs as proof without correlating request and error context."
    - "Run one APM agent, not several: appsignal, newrelic_rpm, and scout_apm each install their own instrumentation, transport, and reporting pipeline, so running two duplicates overhead and splits the picture."
    - "Keep one error backend: sentry-ruby and rollbar both aggregate exceptions, and a second one divides ownership without adding coverage."
