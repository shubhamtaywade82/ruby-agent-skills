version: 1
source:
  rails: https://guides.rubyonrails.org/getting_started.html
  config: https://guides.rubyonrails.org/configuring.html
  puma: https://puma.io/puma/file.deployment.html
  puma_restart: https://puma.io/puma/file.restart.html
  solid_queue: https://github.com/rails/solid_queue

tools:
  rails-production-run:
    category: runtime_verification
    command: RAILS_ENV=production bundle exec rails runner
    application_only: true
  puma-check:
    category: web_runtime
    command: bundle exec puma --help
    application_only: true
  solid-queue-start:
    category: job_runtime
    command: bin/jobs start
    application_only: true
  rails-health:
    category: health_verification
    command: curl
    application_only: true
  rails-kamal:
    category: deployment
    command: bin/kamal
    application_only: true
    optional: true

selection:
  rules:
    - "Inspect the repository's actual process manager and deployment tooling before using commands."
    - "Resolve Rails, Puma, Solid Queue, Ruby, and platform versions before using version-sensitive runtime settings."
    - "Do not print secret values during runtime diagnostics."
    - "Treat skipped deployment tooling as unverified."
