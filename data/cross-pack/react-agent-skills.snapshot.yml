# Cross-pack contract snapshot: react-agent-skills
#
# Pins the companion repository's public skill inventory so that name
# collisions with this pack are a checked contract instead of an
# undocumented accident. The companion pack is a separate repository that
# moves independently; this snapshot is deliberately data-only, and nothing
# in this repository executes against the companion at validation time.
#
# Refresh procedure:
#
#   1. List the companion's skills (GET
#      repos/shubhamtaywade82/react-agent-skills/contents/skills) and record
#      the companion commit the listing was taken from.
#   2. Update companion_commit, captured_at, and skills below.
#   3. Re-run test/cross_pack_contract_system_test.rb and update
#      documented_name_collisions to the recomputed intersection.
#
# The system test fails when either side changes names without a conscious
# snapshot refresh, which is the drift signal this contract exists to give.

